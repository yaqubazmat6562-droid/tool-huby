<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Tool Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .offline-container {
            text-align: center;
            max-width: 500px;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        
        .offline-icon {
            font-size: 5rem;
            color: #60a5fa;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
        }
        
        h1 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #60a5fa;
        }
        
        p {
            color: #cbd5e1;
            margin-bottom: 10px;
            line-height: 1.6;
        }
        
        .tips {
            background: rgba(96, 165, 250, 0.1);
            border-left: 3px solid #60a5fa;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: left;
        }
        
        .tips h3 {
            font-size: 1rem;
            margin-bottom: 8px;
            color: #60a5fa;
        }
        
        .tips ul {
            list-style: none;
            padding-left: 0;
        }
        
        .tips li {
            color: #cbd5e1;
            font-size: 0.9rem;
            padding: 4px 0;
        }
        
        .tips li::before {
            content: "✓ ";
            color: #10b981;
            font-weight: bold;
            margin-right: 6px;
        }
        
        .retry-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        
        .retry-btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
        }
        
        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            margin-top: 15px;
        }
        
        .status.online {
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">
            <i class="fa-solid fa-wifi"></i>
        </div>
        <h1>You're Offline</h1>
        <p>Koi baat nahi! Tool Hub ka kuch hissa abhi bhi kaam kar raha hai.</p>
        
        <div class="tips">
            <h3>💡 Available Offline:</h3>
            <ul>
                <li>Word Counter</li>
                <li>Case Converter</li>
                <li>Base64 Encoder/Decoder</li>
                <li>Password Generator</li>
                <li>Color Palette Generator</li>
            </ul>
        </div>
        
        <p>Aap ye tools bina internet ke bhi use kar sakte hain!</p>
        
        <button class="retry-btn" onclick="window.location.reload()">
            <i class="fa-solid fa-rotate-right"></i> Try Again
        </button>
        
        <div class="status" id="status">
            <i class="fa-solid fa-circle"></i>
            <span id="status-text">Checking connection...</span>
        </div>
    </div>
    
    <script>
        // Internet status check
        function updateStatus() {
            const status = document.getElementById('status');
            const statusText = document.getElementById('status-text');
            
            if (navigator.onLine) {
                status.classList.add('online');
                status.querySelector('i').className = 'fa-solid fa-circle-check';
                statusText.textContent = 'Back online! Reloading...';
                setTimeout(() => window.location.reload(), 1500);
            } else {
                status.classList.remove('online');
                status.querySelector('i').className = 'fa-solid fa-circle';
                statusText.textContent = 'No internet connection';
            }
        }
        
        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);
        updateStatus();
    </script>
</body>
</html>
