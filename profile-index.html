<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/icon-96x96.png">
    <title>My Profile - Tool Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <style>
        .profile-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px 60px;
        }
        .profile-header {
            background: linear-gradient(135deg, #2563eb, #8b5cf6);
            border-radius: 20px;
            padding: 40px 30px;
            color: white;
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(37, 99, 235, 0.3);
        }
        .profile-header::before {
            content: "";
            position: absolute;
            top: -50%; right: -20%;
            width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
            border-radius: 50%;
        }
        .profile-avatar-lg {
            width: 100px; height: 100px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.2rem; font-weight: 800;
            backdrop-filter: blur(10px);
            border: 4px solid rgba(255,255,255,0.3);
            flex-shrink: 0;
            text-transform: uppercase;
            position: relative; z-index: 1;
        }
        .profile-info { position: relative; z-index: 1; flex: 1; min-width: 0; }
        .profile-info h1 { font-size: 1.8rem; margin-bottom: 6px; word-break: break-word; }
        .profile-info p { opacity: 0.9; font-size: 0.9rem; word-break: break-all; }
        .profile-info .joined {
            font-size: 0.78rem; opacity: 0.8; margin-top: 8px;
            display: flex; align-items: center; gap: 6px;
        }
        .profile-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: 0.25s;
        }
        .stat-card:hover { transform: translateY(-4px); border-color: var(--primary); }
        .stat-card i { font-size: 1.6rem; color: var(--primary); margin-bottom: 10px; }
        .stat-card .stat-value { font-size: 1.8rem; font-weight: 800; color: var(--text-color); line-height: 1; }
        .stat-card .stat-label { font-size: 0.78rem; color: var(--text-muted); margin-top: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .profile-section {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .profile-section h2 {
            font-size: 1.1rem; margin-bottom: 18px;
            display: flex; align-items: center; gap: 10px;
            color: var(--text-color);
        }
        .profile-section h2 i { color: var(--primary); }
        .profile-field {
            margin-bottom: 16px;
        }
        .profile-field label {
            display: block; font-size: 0.78rem; font-weight: 700;
            color: var(--text-muted); margin-bottom: 6px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .profile-field input {
            width: 100%; padding: 12px 14px;
            background: var(--bg-color);
            border: 2px solid var(--border);
            border-radius: 10px;
            color: var(--text-color);
            font-size: 0.92rem; font-family: inherit;
            outline: none; transition: 0.2s;
        }
        .profile-field input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }
        .profile-field input:disabled {
            opacity: 0.6; cursor: not-allowed;
        }
        .profile-actions {
            display: flex; gap: 10px; flex-wrap: wrap;
            margin-top: 20px;
        }
        .btn-save {
            padding: 12px 24px;
            background: var(--primary); color: white;
            border: none; border-radius: 10px;
            font-weight: 700; cursor: pointer;
            font-family: inherit; font-size: 0.88rem;
            display: inline-flex; align-items: center; gap: 8px;
            transition: 0.2s;
        }
        .btn-save:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .btn-danger {
            padding: 12px 24px;
            background: transparent; color: #ef4444;
            border: 2px solid #ef4444; border-radius: 10px;
            font-weight: 700; cursor: pointer;
            font-family: inherit; font-size: 0.88rem;
            display: inline-flex; align-items: center; gap: 8px;
            transition: 0.2s;
        }
        .btn-danger:hover { background: #ef4444; color: white; }
        .btn-secondary {
            padding: 12px 24px;
            background: var(--bg-color); color: var(--text-color);
            border: 2px solid var(--border); border-radius: 10px;
            font-weight: 700; cursor: pointer;
            font-family: inherit; font-size: 0.88rem;
            display: inline-flex; align-items: center; gap: 8px;
            transition: 0.2s;
        }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
        .not-logged-in {
            text-align: center;
            padding: 80px 20px;
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border);
        }
        .not-logged-in i { font-size: 4rem; color: var(--primary); opacity: 0.4; margin-bottom: 20px; }
        .not-logged-in h2 { font-size: 1.5rem; margin-bottom: 10px; color: var(--text-color); }
        .not-logged-in p { color: var(--text-muted); margin-bottom: 24px; }
        @media (max-width: 480px) {
            .profile-container { padding: 15px 12px 40px; }
            .profile-header {
                flex-direction: column;
                text-align: center;
                padding: 28px 20px;
                gap: 16px;
            }
            .profile-avatar-lg { width: 80px; height: 80px; font-size: 1.8rem; }
            .profile-info h1 { font-size: 1.35rem; }
            .profile-section { padding: 18px; }
            .profile-actions { flex-direction: column; }
            .profile-actions button { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="logo">
        <i class="fa-solid fa-wrench"></i>
        <h2>Tool Hub</h2>
    </div>
    <nav>
        <ul>
            <li onclick="window.location.href='index.html'">
                <i class="fa-solid fa-house"></i> Home
            </li>
            <li onclick="window.location.href='alltools-index.html'">
                <i class="fa-solid fa-toolbox"></i> All Tools
            </li>
            <li onclick="window.location.href='favorites-index.html'">
                <i class="fa-solid fa-heart"></i> Favorites
            </li>
            <li onclick="window.location.href='history-index.html'">
                <i class="fa-solid fa-clock-rotate-left"></i> History
            </li>
        </ul>
    </nav>
    <div class="login-box"></div>
</aside>

<main class="main-content">
    <header>
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search tools..." id="navbar-search">
        </div>
        <div class="nav-actions">
            <button id="theme-toggle"><i class="fa-solid fa-moon"></i></button>
            <button onclick="window.location.href='index.html'">
                <i class="fa-solid fa-arrow-left"></i> Back
            </button>
        </div>
    </header>

    <div class="profile-container" id="profile-content">
        <!-- Rendered by JS -->
    </div>
</main>

<div id="toast" class="toast">Message</div>

<script src="auth.js"></script>
<script src="favorites-history.js"></script>
<script>
    // ============ PROFILE PAGE LOGIC ============
    function renderProfile() {
        const user = AuthSystem.getCurrentUser();
        const container = document.getElementById('profile-content');

        if (!user) {
            container.innerHTML = `
                <div class="not-logged-in">
                    <i class="fa-solid fa-user-lock"></i>
                    <h2>Not Logged In</h2>
                    <p>Please login to view your profile</p>
                    <button class="btn-save" onclick="AuthSystem.openModal('login')">
                        <i class="fa-solid fa-right-to-bracket"></i> Login Now
                    </button>
                </div>
            `;
            return;
        }

        // Get user stats
        const favs = JSON.parse(localStorage.getItem('toolhub_favorites')) || [];
        const history = JSON.parse(localStorage.getItem('toolhub_history')) || [];
        const joined = new Date(user.createdAt).toLocaleDateString('en-US', {
            year: 'numeric', month: 'long', day: 'numeric'
        });

        container.innerHTML = `
            <div class="profile-header">
                <div class="profile-avatar-lg">${AuthSystem.getInitials(user.name)}</div>
                <div class="profile-info">
                    <h1>${escapeHtml(user.name)}</h1>
                    <p><i class="fa-solid fa-envelope"></i> ${escapeHtml(user.email)}</p>
                    <div class="joined">
                        <i class="fa-solid fa-calendar"></i> Joined ${joined}
                    </div>
                </div>
            </div>

            <div class="profile-stats">
                <div class="stat-card">
                    <i class="fa-solid fa-heart"></i>
                    <div class="stat-value">${favs.length}</div>
                    <div class="stat-label">Favorites</div>
                </div>
                <div class="stat-card">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <div class="stat-value">${history.length}</div>
                    <div class="stat-label">Recent Uses</div>
                </div>
                <div class="stat-card">
                    <i class="fa-solid fa-toolbox"></i>
                    <div class="stat-value">${typeof ALL_TOOLS !== 'undefined' ? ALL_TOOLS.length : '50+'}</div>
                    <div class="stat-label">Total Tools</div>
                </div>
            </div>

            <div class="profile-section">
                <h2><i class="fa-solid fa-user-pen"></i> Edit Profile</h2>
                <div class="profile-field">
                    <label>Full Name</label>
                    <input type="text" id="edit-name" value="${escapeHtml(user.name)}" minlength="2">
                </div>
                <div class="profile-field">
                    <label>Email Address (cannot be changed)</label>
                    <input type="email" value="${escapeHtml(user.email)}" disabled>
                </div>
                <div class="profile-actions">
                    <button class="btn-save" onclick="saveProfile()">
                        <i class="fa-solid fa-check"></i> Save Changes
                    </button>
                </div>
            </div>

            <div class="profile-section">
                <h2><i class="fa-solid fa-lock"></i> Change Password</h2>
                <div class="profile-field">
                    <label>New Password</label>
                    <input type="password" id="new-password" placeholder="Enter new password (min 8 chars)">
                </div>
                <div class="profile-field">
                    <label>Confirm New Password</label>
                    <input type="password" id="confirm-password" placeholder="Re-enter new password">
                </div>
                <div class="profile-actions">
                    <button class="btn-save" onclick="changePassword()">
                        <i class="fa-solid fa-key"></i> Update Password
                    </button>
                </div>
            </div>

            <div class="profile-section">
                <h2><i class="fa-solid fa-shield-halved"></i> Security</h2>
                <div class="profile-field">
                    <label>Security Question</label>
                    <input type="text" value="${escapeHtml(user.securityQuestion)}" disabled>
                </div>
                <div class="profile-actions">
                    <button class="btn-danger" onclick="confirmLogout()">
                        <i class="fa-solid fa-right-from-bracket"></i> Logout
                    </button>
                </div>
            </div>
        `;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    async function saveProfile() {
        const name = document.getElementById('edit-name').value.trim();
        try {
            await AuthSystem.updateProfile({ name });
            showToast('✅ Profile updated successfully!');
            renderProfile();
            AuthSystem.updateAuthUI();
        } catch (err) {
            showToast('❌ ' + err.message);
        }
    }

    async function changePassword() {
        const pwd = document.getElementById('new-password').value;
        const confirm = document.getElementById('confirm-password').value;

        if (pwd !== confirm) {
            showToast('❌ Passwords do not match!');
            return;
        }

        try {
            await AuthSystem.updateProfile({ password: pwd });
            showToast('🔐 Password updated!');
            document.getElementById('new-password').value = '';
            document.getElementById('confirm-password').value = '';
        } catch (err) {
            showToast('❌ ' + err.message);
        }
    }

    function confirmLogout() {
        if (confirm('Are you sure you want to logout?')) {
            AuthSystem.logout();
        }
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
    }

    // Theme toggle
    const themeToggle = document.getElementById('theme-toggle');
    themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        const icon = themeToggle.querySelector('i');
        if (document.body.classList.contains('dark-mode')) {
            icon.classList.replace('fa-moon', 'fa-sun');
            localStorage.setItem('toolhub_theme', 'dark');
        } else {
            icon.classList.replace('fa-sun', 'fa-moon');
            localStorage.setItem('toolhub_theme', 'light');
        }
    });

    if (localStorage.getItem('toolhub_theme') === 'dark') {
        document.body.classList.add('dark-mode');
        themeToggle.querySelector('i').classList.replace('fa-moon', 'fa-sun');
    }

    renderProfile();
</script>
</body>
</html>
