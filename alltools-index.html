<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Tool Hub">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-152x152.png">
    <link rel="icon" type="image/png" href="icons/icon-96x96.png">
    <title>All Tools - Tool Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="alltools-style.css">
    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <!-- ============ TOP NAVBAR ============ -->
    <header class="top-navbar">
        <div class="navbar-left">
            <a href="index.html" class="back-btn" title="Back to Home">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <a href="index.html" class="navbar-logo">
                <i class="fa-solid fa-wrench"></i>
                <span>Tool Hub</span>
            </a>
        </div>
        <div class="navbar-right">
            <a href="favorites-index.html" class="nav-icon-btn" title="Favorites">
                <i class="fa-solid fa-heart"></i>
                <span class="badge-count" id="fav-count-badge">0</span>
            </a>
            <a href="history-index.html" class="nav-icon-btn" title="History">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span class="badge-count" id="history-count-badge">0</span>
            </a>
            <button id="theme-toggle" title="Toggle Theme">
                <i class="fa-solid fa-moon"></i>
            </button>
            <button class="share-btn" onclick="shareTool()" title="Share">
                <i class="fa-solid fa-share-nodes"></i> Share
            </button>
        </div>
    </header>

    <!-- ============ BREADCRUMB ============ -->
    <div class="breadcrumb-bar">
        <div class="breadcrumb">
            <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
            <i class="fa-solid fa-chevron-right"></i>
            <span>All Tools</span>
        </div>
    </div>

    <!-- ============ MAIN CONTENT ============ -->
    <main class="container">

        <!-- Header -->
        <div class="page-header">
            <div class="page-title">
                <h1><i class="fa-solid fa-toolbox"></i> All Tools</h1>
                <p>Explore our complete collection of <span id="total-tools-count">0</span> free online tools</p>
            </div>
        </div>

        <!-- ============ SEARCH & FILTERS ============ -->
        <div class="filters-panel">
            <!-- Search -->
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Search tools... (e.g. calculator, JSON, image)">
                <button class="clear-search" id="clear-search-btn" onclick="clearSearch()" style="display: none;">
                    <i class="fa-solid fa-times"></i>
                </button>
            </div>

            <!-- Category Filter -->
            <div class="category-filter">
                <button class="filter-btn active" data-category="all" onclick="filterByCategory('all')">
                    <i class="fa-solid fa-layer-group"></i> All
                    <span class="count" id="count-all">0</span>
                </button>
                <button class="filter-btn" data-category="text" onclick="filterByCategory('text')">
                    <i class="fa-solid fa-font"></i> Text
                    <span class="count" id="count-text">0</span>
                </button>
                <button class="filter-btn" data-category="calc" onclick="filterByCategory('calc')">
                    <i class="fa-solid fa-calculator"></i> Calculator
                    <span class="count" id="count-calc">0</span>
                </button>
                <button class="filter-btn" data-category="dev" onclick="filterByCategory('dev')">
                    <i class="fa-solid fa-code"></i> Developer
                    <span class="count" id="count-dev">0</span>
                </button>
                <button class="filter-btn" data-category="image" onclick="filterByCategory('image')">
                    <i class="fa-solid fa-image"></i> Image
                    <span class="count" id="count-image">0</span>
                </button>
                <button class="filter-btn" data-category="gen" onclick="filterByCategory('gen')">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Generator
                    <span class="count" id="count-gen">0</span>
                </button>
                <button class="filter-btn" data-category="date" onclick="filterByCategory('date')">
                    <i class="fa-solid fa-calendar-day"></i> Date & Time
                    <span class="count" id="count-date">0</span>
                </button>
                <button class="filter-btn" data-category="finance" onclick="filterByCategory('finance')">
                    <i class="fa-solid fa-coins"></i> Finance
                    <span class="count" id="count-finance">0</span>
                </button>
            </div>

            <!-- Sort & View -->
            <div class="sort-view">
                <select id="sort-select" class="sort-select" onchange="sortTools()">
                    <option value="popular">🔥 Popular First</option>
                    <option value="az">🔤 A → Z</option>
                    <option value="za">🔤 Z → A</option>
                    <option value="newest">🆕 Newest First</option>
                </select>
                <div class="view-toggle">
                    <button class="view-btn active" onclick="setView('grid')" title="Grid View" id="view-grid">
                        <i class="fa-solid fa-grip"></i>
                    </button>
                    <button class="view-btn" onclick="setView('list')" title="List View" id="view-list">
                        <i class="fa-solid fa-list"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- ============ RESULTS INFO ============ -->
        <div class="results-info">
            <span id="results-text">Showing <b>0</b> tools</span>
            <button class="clear-filters-btn" onclick="clearAllFilters()" id="clear-filters-btn" style="display: none;">
                <i class="fa-solid fa-times"></i> Clear Filters
            </button>
        </div>

        <!-- ============ TOOLS GRID ============ -->
        <div class="tools-grid" id="tools-grid">
            <!-- Populated by JS -->
        </div>

        <!-- ============ NO RESULTS ============ -->
        <div class="no-results" id="no-results" style="display: none;">
            <i class="fa-solid fa-magnifying-glass"></i>
            <h3>No tools found</h3>
            <p>Try different keywords or clear filters</p>
            <button class="btn btn-primary" onclick="clearAllFilters()">
                <i class="fa-solid fa-rotate-left"></i> Reset Filters
            </button>
        </div>

    </main>

    <!-- ============ FOOTER ============ -->
    <footer class="footer">
        <p>© 2025 Tool Hub — All Your Online Tools in One Place</p>
    </footer>

    <!-- ============ TOAST ============ -->
    <div id="toast" class="toast">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toast-message">Message</span>
    </div>

    <!-- ============ SCRIPTS (ORDER MATTERS!) ============ -->
    <script src="alltools-script.js"></script>
    <script src="favorites-history.js"></script>
    <script src="search.js"></script>
    <script src="pwa-init.js"></script>
</body>
</html>
